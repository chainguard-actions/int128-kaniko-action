name: Test basic no-push build
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Dockerfile for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/basic-context"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/basic-context/Dockerfile" <<'EOF'
          FROM scratch
          LABEL maintainer="test"
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          executor: gcr.io/kaniko-project/executor:v1.24.0
          context: ${{ github.workspace }}/tests/fixtures/basic-context
          file: ${{ github.workspace }}/tests/fixtures/basic-context/Dockerfile
          push: 'false'

      - name: Assert action ran (build succeeded or failed gracefully without Docker)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "outcome: $OUTCOME"
          echo "digest: $DIGEST"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker/Kaniko not available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
