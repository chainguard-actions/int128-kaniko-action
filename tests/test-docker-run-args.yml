name: Test docker-run-args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker credentials directory
        run: |
          mkdir -p "$HOME/.docker"
          echo '{}' > "$HOME/.docker/config.json"

      - name: Prepare runner temp dir inside workspace (for Docker volume mounts under act)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_runner_temp"

      - name: Install fake docker to intercept kaniko-action calls
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-docker/docker" "$GITHUB_WORKSPACE/_bin/docker"
          chmod +x "$GITHUB_WORKSPACE/_bin/docker"
          echo "$GITHUB_WORKSPACE/_bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        env:
          RUNNER_TEMP: ${{ github.workspace }}/_runner_temp
        with:
          executor: fake/kaniko-executor:latest
          context: tests/fixtures/basic
          push: 'false'
          tags: |
            localhost/test-docker-run-args:latest
          docker-run-args: |
            --env MY_VAR=test-value

      - name: Assert action completed successfully
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "digest: $DIGEST"
          if [ -z "$DIGEST" ]; then
            echo "FAIL: expected a non-empty digest output"
            exit 1
          fi
          echo "PASS: action completed successfully with docker-run-args, digest: $DIGEST"
