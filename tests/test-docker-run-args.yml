name: Test docker-run-args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Dockerfile
        run: |
          echo 'FROM scratch' > "$GITHUB_WORKSPACE/Dockerfile"
      - id: action
        uses: .
        continue-on-error: true
        with:
          push: 'false'
          context: '${{ github.workspace }}'
          file: '${{ github.workspace }}/Dockerfile'
          tags: 'localhost/test-docker-run-args:latest'
          docker-run-args: |
            --memory=512m
      - name: Assert action ran with docker-run-args input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME) — docker-run-args input was accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
