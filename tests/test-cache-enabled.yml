name: Test build with cache enabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Dockerfile for cache test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/cache-context"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/cache-context/Dockerfile" <<'EOF'
          FROM scratch
          LABEL test="cache"
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          executor: gcr.io/kaniko-project/executor:v1.24.0
          context: ${{ github.workspace }}/tests/fixtures/cache-context
          file: ${{ github.workspace }}/tests/fixtures/cache-context/Dockerfile
          push: 'false'
          cache: 'true'
          cache-repository: ghcr.io/example/cache
          cache-ttl: 24h

      - name: Assert action ran (build succeeded or failed gracefully without Docker)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with cache enabled"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker/Kaniko not available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
