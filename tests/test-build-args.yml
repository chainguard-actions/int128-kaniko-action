name: Test build-args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run kaniko-action with build-args
        uses: .
        continue-on-error: true
        with:
          context: tests/fixtures/with-args
          file: tests/fixtures/with-args/Dockerfile
          push: 'false'
          build-args: |
            MY_ARG=hello-from-test

      - name: Assert action ran (digest set, or failed gracefully in no-push mode)
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "digest: $DIGEST"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DIGEST" ]; then
              echo "FAIL: action succeeded but digest output is empty"
              exit 1
            fi
            echo "PASS: got digest '$DIGEST'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Kaniko --no-push does not write a digest file)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
