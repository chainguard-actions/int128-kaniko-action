name: Test build with build-args and labels
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Dockerfile that uses build args
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/buildargs-context"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/buildargs-context/Dockerfile" <<'EOF'
          FROM scratch
          ARG MY_VERSION=unknown
          LABEL version=$MY_VERSION
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          executor: gcr.io/kaniko-project/executor:v1.24.0
          context: ${{ github.workspace }}/tests/fixtures/buildargs-context
          file: ${{ github.workspace }}/tests/fixtures/buildargs-context/Dockerfile
          push: 'false'
          build-args: |
            MY_VERSION=1.2.3
          labels: |
            org.opencontainers.image.version=1.2.3
            org.opencontainers.image.source=https://github.com/example/repo

      - name: Assert action ran (build succeeded or failed gracefully without Docker)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with build-args and labels"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker/Kaniko not available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
