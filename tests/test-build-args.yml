name: Test build-args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake docker
        run: |
          sudo cp "$GITHUB_WORKSPACE/tests/fixtures/fake-docker.sh" /usr/local/bin/docker
          sudo chmod +x /usr/local/bin/docker
          which docker
          docker --version || true

      - name: Run kaniko action with build-args (no-push)
        id: action
        uses: .
        with:
          executor: gcr.io/kaniko-project/executor:v1.24.0
          context: ${{ github.workspace }}/tests/fixtures/build-args
          file: ${{ github.workspace }}/tests/fixtures/build-args/Dockerfile
          push: 'false'
          build-args: |
            MY_ARG=hello-from-test

      - name: Assert digest output is set
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "digest: $DIGEST"
          if [ -z "$DIGEST" ]; then
            echo "FAIL: expected digest output to be non-empty"
            exit 1
          fi
          if echo "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "PASS: digest is $DIGEST"
          else
            echo "FAIL: expected digest to match sha256:<hex64>, got: $DIGEST"
            exit 1
          fi
