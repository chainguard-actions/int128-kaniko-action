name: Test build with build-args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run kaniko-action with build-args
        id: action
        uses: .
        continue-on-error: true
        with:
          push: 'false'
          context: ${{ github.workspace }}/tests/fixtures/build-args
          file: ${{ github.workspace }}/tests/fixtures/build-args/Dockerfile
          build-args: |
            MY_ARG=hello-from-test

      - name: Assert action ran (digest set or failed gracefully with no-push)
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "digest: $DIGEST"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DIGEST" ]; then
              echo "FAIL: action succeeded but digest output is empty"
              exit 1
            fi
            echo "PASS: digest is set to '$DIGEST'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no-push may not produce a digest)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
