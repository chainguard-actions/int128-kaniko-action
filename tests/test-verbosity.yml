name: Test build with verbosity setting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock docker
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/docker << 'EOF'
          #!/bin/sh
          echo "mock docker called with: $@"
          # Handle 'docker pull' - just succeed
          if [ "$1" = "pull" ]; then
            echo "mock: pulled $2"
            exit 0
          fi
          # Handle 'docker run' - find the outputs volume mount and write digest
          if [ "$1" = "run" ]; then
            OUTPUTS_DIR=""
            PREV=""
            for arg in "$@"; do
              if [ "$PREV" = "-v" ]; then
                HOST=$(echo "$arg" | cut -d: -f1)
                CONTAINER=$(echo "$arg" | cut -d: -f2 | cut -d: -f1)
                if [ "$CONTAINER" = "/kaniko/action/outputs" ]; then
                  OUTPUTS_DIR="$HOST"
                fi
              fi
              PREV="$arg"
            done
            if [ -n "$OUTPUTS_DIR" ]; then
              echo "sha256:cafebabecafebabecafebabecafebabecafebabecafebabecafebabecafebabe" > "$OUTPUTS_DIR/digest"
              echo "mock: wrote digest to $OUTPUTS_DIR/digest"
            else
              echo "mock: WARNING: could not find outputs dir"
              exit 1
            fi
            exit 0
          fi
          echo "mock: unknown docker command: $1"
          exit 1
          EOF
          chmod +x /tmp/mock-bin/docker
      - id: action
        uses: .
        env:
          PATH: /tmp/mock-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        with:
          executor: alpine:3.19
          context: ${{ github.workspace }}/tests/fixtures
          file: ${{ github.workspace }}/tests/fixtures/Dockerfile
          push: 'false'
          verbosity: info
      - name: Assert digest output is set
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "digest: $DIGEST"
          if [ -z "$DIGEST" ]; then
            echo "FAIL: expected digest output to be non-empty"
            exit 1
          fi
          echo "PASS: action completed with verbosity=info"
