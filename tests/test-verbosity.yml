name: Test build with verbosity
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mock docker
        run: |
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/docker" << 'EOF'
          #!/bin/bash
          echo "Mock docker called with: $@"
          if [ "$1" = "pull" ]; then
            echo "Mock: docker pull $2"
            exit 0
          fi
          if [ "$1" = "run" ]; then
            echo "Mock: docker run invoked"
            # Parse -v args to find the outputs mount: <host_path>:/kaniko/action/outputs
            outputs_host_dir=""
            found_verbosity=false
            prev=""
            for arg in "$@"; do
              if [ "$prev" = "-v" ]; then
                host_part="${arg%%:*}"
                container_part="${arg#*:}"
                container_part="${container_part%%:*}"
                if [ "$container_part" = "/kaniko/action/outputs" ]; then
                  outputs_host_dir="$host_part"
                fi
              fi
              if [ "$prev" = "--verbosity" ] && [ "$arg" = "info" ]; then
                found_verbosity=true
              fi
              prev="$arg"
            done
            if [ -n "$outputs_host_dir" ]; then
              echo "sha256:abc123def456" > "$outputs_host_dir/digest"
              echo "Mock: wrote digest to $outputs_host_dir/digest"
            else
              echo "ERROR: could not find /kaniko/action/outputs mount" >&2
              exit 1
            fi
            if [ "$found_verbosity" = "false" ]; then
              echo "ERROR: --verbosity info not found in args: $@" >&2
              exit 1
            fi
            exit 0
          fi
          echo "Mock: docker $@"
          exit 0
          EOF
          chmod +x "$HOME/bin/docker"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          push: 'false'
          context: ${{ github.workspace }}/pristine/int128--kaniko-action/v1.62.0/tests/fixtures
          file: ${{ github.workspace }}/pristine/int128--kaniko-action/v1.62.0/tests/fixtures/Dockerfile
          tags: localhost/test-image:verbosity
          verbosity: info
      - name: Assert action completed successfully
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "digest: $DIGEST"
          if [ -z "$DIGEST" ]; then
            echo "FAIL: expected digest output to be non-empty"
            exit 1
          fi
          echo "PASS"
