name: Test build with target stage (multi-stage Dockerfile)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a multi-stage Dockerfile for target test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/target-context"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/target-context/Dockerfile" <<'EOF'
          FROM scratch AS base
          LABEL stage="base"

          FROM scratch AS final
          LABEL stage="final"
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          executor: gcr.io/kaniko-project/executor:v1.24.0
          context: ${{ github.workspace }}/tests/fixtures/target-context
          file: ${{ github.workspace }}/tests/fixtures/target-context/Dockerfile
          push: 'false'
          target: base

      - name: Assert action ran (build succeeded or failed gracefully without Docker)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with target stage"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker/Kaniko not available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
