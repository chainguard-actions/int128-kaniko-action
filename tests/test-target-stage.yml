name: Test build with target stage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake docker
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-docker.sh" /usr/local/bin/docker
          chmod +x /usr/local/bin/docker
          echo "Fake docker installed at /usr/local/bin/docker"
          which docker

      - id: action
        uses: .
        with:
          context: tests/fixtures/multistage
          file: tests/fixtures/multistage/Dockerfile
          push: 'false'
          target: builder
        env:
          FAKE_DOCKER_SCENARIO: target-stage

      - name: Assert digest output is set
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "digest: $DIGEST"
          if [ -z "$DIGEST" ]; then
            echo "FAIL: expected digest output to be non-empty when targeting a stage"
            exit 1
          fi
          echo "PASS: digest is set to $DIGEST"

      - name: Assert digest looks like a sha256 digest
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "digest: $DIGEST"
          if ! echo "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "FAIL: digest does not match sha256 format: $DIGEST"
            exit 1
          fi
          echo "PASS: digest has correct sha256 format"
