name: Test build failure is reported
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install failing fake docker on PATH
        run: |
          mkdir -p /tmp/fake-docker/bin
          rm -f /tmp/fake-docker/calls.log
          touch /tmp/fake-docker/fail
          cat > /tmp/fake-docker/bin/docker <<'EOF'
          #!/bin/bash
          LOG=/tmp/fake-docker/calls.log
          { echo "---CALL---"; for a in "$@"; do echo "$a"; done; } >> "$LOG"
          if [ "$1" = "pull" ]; then exit 0; fi
          if [ "$1" = "run" ]; then
            if [ -f /tmp/fake-docker/fail ]; then echo "simulated kaniko failure" >&2; exit 1; fi
            exit 0
          fi
          exit 0
          EOF
          chmod +x /tmp/fake-docker/bin/docker
          echo "/tmp/fake-docker/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          context: tests/fixtures/app
          tags: example.com/test/app:fail
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          cat /tmp/fake-docker/calls.log
          echo "outcome: $OUTCOME"
          echo "digest: $DIGEST"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail when kaniko fails"
            exit 1
          fi
          if [ -n "$DIGEST" ]; then
            echo "FAIL: digest should be empty on failure"
            exit 1
          fi
          if ! grep -qxF run /tmp/fake-docker/calls.log; then
            echo "FAIL: docker run was never invoked"
            exit 1
          fi
          echo "PASS"
