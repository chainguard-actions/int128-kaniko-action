name: Test basic build (no push)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake docker
        run: |
          mkdir -p "$HOME/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-docker.sh" "$HOME/bin/docker"
          chmod +x "$HOME/bin/docker"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - id: build
        name: Run kaniko-action (no push)
        uses: .
        with:
          context: tests/fixtures/basic
          file: tests/fixtures/basic/Dockerfile
          push: 'false'

      - name: Assert action completed
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "digest: $DIGEST"
          if [ -z "$DIGEST" ]; then
            echo "FAIL: expected a digest output"
            exit 1
          fi
          echo "PASS: action completed successfully"
