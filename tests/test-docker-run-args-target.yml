name: Test docker-run-args and target inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock docker
        run: |
          mkdir -p "$HOME/.docker"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-docker.sh" /usr/local/bin/docker
          chmod +x /usr/local/bin/docker
          which docker

      - name: Create multi-stage Dockerfile fixture
        run: |
          cat > /tmp/Dockerfile.multistage <<'EOF'
          FROM alpine:3.18 AS builder
          RUN echo "builder stage"
          FROM alpine:3.18 AS final
          COPY --from=builder /etc/os-release /etc/os-release
          EOF
          cp /tmp/Dockerfile.multistage "$GITHUB_WORKSPACE/tests/fixtures/Dockerfile.multistage"

      - id: action
        uses: .
        with:
          executor: gcr.io/kaniko-project/executor:v1.24.0
          push: 'false'
          tags: localhost:5000/test-docker-run-args-target:latest
          context: ${{ github.workspace }}/tests/fixtures
          file: ${{ github.workspace }}/tests/fixtures/Dockerfile.multistage
          target: builder
          docker-run-args: |
            --env=MY_VAR=test

      - name: Assert digest output is set
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "digest: $DIGEST"
          if [ -z "$DIGEST" ]; then
            echo "FAIL: expected digest output to be non-empty after build with docker-run-args and target"
            exit 1
          fi
          echo "PASS: digest is $DIGEST"
