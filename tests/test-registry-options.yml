name: Test registry options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          push: 'false'
          push-retry: '3'
          registry-mirror: |
            mirror.gcr.io
          tags: |
            ghcr.io/example/image:registry-test
      - name: Assert action completed
        run: |
          echo "Action completed successfully with push-retry and registry-mirror inputs"
          echo "PASS"
