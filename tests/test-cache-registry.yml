name: Test cache and registry inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock docker
        run: |
          mkdir -p "$HOME/.docker"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-docker.sh" /usr/local/bin/docker
          chmod +x /usr/local/bin/docker
          which docker

      - id: action
        uses: .
        with:
          executor: gcr.io/kaniko-project/executor:v1.24.0
          push: 'false'
          tags: localhost:5000/test-cache-registry:latest
          context: ${{ github.workspace }}/tests/fixtures
          file: ${{ github.workspace }}/tests/fixtures/Dockerfile
          cache: 'true'
          cache-repository: localhost:5000/cache
          cache-ttl: 24h
          push-retry: '2'
          registry-mirror: |
            mirror.gcr.io
            mirror2.gcr.io

      - name: Assert digest output is set
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "digest: $DIGEST"
          if [ -z "$DIGEST" ]; then
            echo "FAIL: expected digest output to be non-empty after build with cache/registry inputs"
            exit 1
          fi
          echo "PASS: digest is $DIGEST"
