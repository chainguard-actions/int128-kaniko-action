name: Test build with extra kaniko-args and verbosity
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Dockerfile for kaniko-args test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/kanikoargs-context"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/kanikoargs-context/Dockerfile" <<'EOF'
          FROM scratch
          LABEL test="kaniko-args"
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          executor: gcr.io/kaniko-project/executor:v1.24.0
          context: ${{ github.workspace }}/tests/fixtures/kanikoargs-context
          file: ${{ github.workspace }}/tests/fixtures/kanikoargs-context/Dockerfile
          push: 'false'
          verbosity: info
          kaniko-args: |
            --skip-tls-verify-pull
            --single-snapshot

      - name: Assert action ran (build succeeded or failed gracefully without Docker)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with extra kaniko-args"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker/Kaniko not available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
