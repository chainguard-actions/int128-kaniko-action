name: Test kaniko-args and verbosity inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create build context
        run: |
          mkdir -p "$RUNNER_TEMP/kaniko-extra-context"
          cp "$GITHUB_WORKSPACE/tests/fixtures/Dockerfile" "$RUNNER_TEMP/kaniko-extra-context/Dockerfile"

      - id: action
        uses: .
        continue-on-error: true
        with:
          push: 'false'
          context: ${{ runner.temp }}/kaniko-extra-context
          file: ${{ runner.temp }}/kaniko-extra-context/Dockerfile
          verbosity: info
          kaniko-args: |
            --skip-tls-verify-pull
            --single-snapshot

      - name: Assert action ran (build succeeded or failed gracefully)
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "digest: $DIGEST"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with extra kaniko args"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (kaniko/docker may not be available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
